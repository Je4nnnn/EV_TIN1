services:
  postgres:
    image: postgres:16-alpine
    container_name: travelagency-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-travelagency}
      POSTGRES_USER: ${DB_USER:-travelagency_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-travelagency_app} -d ${DB_NAME:-travelagency}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.2
    container_name: travelagency-keycloak
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/hotelrm-realm.json:/opt/keycloak/data/import/hotelrm-realm.json:ro
    ports:
      - "${KEYCLOAK_PORT_DOCKER:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend1:
    image: ${DOCKERHUB_NAMESPACE:-je4nnnn}/travelagency-backend:${IMAGE_TAG:-latest}
    container_name: travelagency-backend-1
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment: &backend-env
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8091
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-travelagency}
      DB_USER: ${DB_USER:-travelagency_app}
      DB_PASSWORD: ${DB_PASSWORD:-changeit}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED_DOCKER:-true}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-hotelrm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hotelrm-frontend}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-hotelrm_admin}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL_DOCKER:-http://keycloak:8080}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI_DOCKER:-http://localhost:8080/realms/${KEYCLOAK_REALM:-hotelrm}}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI_DOCKER:-http://keycloak:8080/realms/${KEYCLOAK_REALM:-hotelrm}/protocol/openid-connect/certs}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS_DOCKER:-http://localhost,http://localhost:80,http://localhost:3001}

  backend2:
    image: ${DOCKERHUB_NAMESPACE:-je4nnnn}/travelagency-backend:${IMAGE_TAG:-latest}
    container_name: travelagency-backend-2
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment: *backend-env

  backend3:
    image: ${DOCKERHUB_NAMESPACE:-je4nnnn}/travelagency-backend:${IMAGE_TAG:-latest}
    container_name: travelagency-backend-3
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment: *backend-env

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-je4nnnn}/travelagency-frontend:${IMAGE_TAG:-latest}
    container_name: travelagency-frontend
    depends_on:
      - backend1
      - backend2
      - backend3
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: travelagency-nginx
    depends_on:
      - frontend
      - backend1
      - backend2
      - backend3
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  postgres-data:
